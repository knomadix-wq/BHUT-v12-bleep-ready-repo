name: Update curated weekly feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-bleep-feed.yml"
      - "scripts/fetch-bleep-weekly.mjs"
      - "scripts/fetch-boomkat-weekly.mjs"
      - "scripts/fetch-bandcamp-electronic.mjs"
      - "scripts/fetch-label-watchlist.mjs"
      - "scripts/fetch-stereogum-aotw.mjs"
      - "scripts/fetch-twgeema-monthly.mjs"
      - "scripts/fetch-aoty-electronic.mjs"
      - "scripts/aoty-utils.mjs"
  schedule:
    # Retry through Friday because Bleep does not always publish at the same hour.
    - cron: "17 9,12,15,18 * * 5"
    # Stereogum Album of the Week normally publishes on Tuesday.
    - cron: "17 18 * * 2"
    # Reveal the current Twgeema chart at two Spotify-matched albums per day.
    - cron: "37 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fetch Bleep roundup
        run: node scripts/fetch-bleep-weekly.mjs
        continue-on-error: true
      - name: Fetch Boomkat roundup
        run: node scripts/fetch-boomkat-weekly.mjs
        continue-on-error: true
      - name: Fetch Bandcamp Daily electronic picks
        run: node scripts/fetch-bandcamp-electronic.mjs
        continue-on-error: true
      - name: Fetch experimental label watchlist
        run: node scripts/fetch-label-watchlist.mjs
        continue-on-error: true
      - name: Fetch Stereogum Album of the Week
        run: node scripts/fetch-stereogum-aotw.mjs
        continue-on-error: true
      - name: Fetch Twgeema monthly electronic chart
        run: node scripts/fetch-twgeema-monthly.mjs
        continue-on-error: true
      - name: Fetch Album of the Year electronic recommendations
        run: node scripts/fetch-aoty-electronic.mjs
        continue-on-error: true
      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/bleep-weekly.json data/boomkat-weekly.json data/bandcamp-electronic.json data/label-watchlist.json data/stereogum-aotw.json data/twgeema-monthly.json data/aoty-electronic.json; then
            echo "Feed is unchanged"
            exit 0
          fi
          git config user.name "NAGA Feed Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bleep-weekly.json data/boomkat-weekly.json data/bandcamp-electronic.json data/label-watchlist.json data/stereogum-aotw.json data/twgeema-monthly.json data/aoty-electronic.json
          git commit -m "Update curated weekly feeds"
          git push
