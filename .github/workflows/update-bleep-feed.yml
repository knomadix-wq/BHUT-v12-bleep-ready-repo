name: Update curated weekly feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-bleep-feed.yml"
      - "scripts/fetch-bleep-weekly.mjs"
      - "scripts/fetch-boomkat-weekly.mjs"
      - "scripts/fetch-bandcamp-electronic.mjs"
      - "scripts/fetch-label-watchlist.mjs"
      - "scripts/fetch-stereogum-aotw.mjs"
      - "scripts/fetch-twgeema-monthly.mjs"
      - "scripts/fetch-aoty-electronic.mjs"
      - "scripts/fetch-editorial-rss.mjs"
      - "scripts/aoty-utils.mjs"
      - "scripts/curated-utils.mjs"
      - "scripts/curated-utils.test.mjs"
  schedule:
    # Retry through Friday because Bleep does not always publish at the same hour.
    - cron: "17 9,12,15,18 * * 5"
    # Stereogum Album of the Week normally publishes on Tuesday.
    - cron: "17 18 * * 2"
    # Reveal the current Twgeema chart at two Spotify-matched albums per day.
    - cron: "37 18 * * *"

concurrency:
  group: curated-feed-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-fast-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      # Run and publish AOTY before the slower label watchlist. A timeout in an
      # unrelated scraper must never leave this feed empty again.
      - name: Fetch Album of the Year electronic recommendations
        id: aoty
        run: node scripts/fetch-aoty-electronic.mjs
        continue-on-error: true
      - name: Fetch Bleep roundup
        id: bleep
        run: node scripts/fetch-bleep-weekly.mjs
        continue-on-error: true
      - name: Fetch Boomkat roundup
        id: boomkat
        run: node scripts/fetch-boomkat-weekly.mjs
        continue-on-error: true
      - name: Fetch Bandcamp Daily electronic picks
        id: bandcamp
        run: node scripts/fetch-bandcamp-electronic.mjs
        continue-on-error: true
      - name: Fetch Stereogum Album of the Week
        id: stereogum
        run: node scripts/fetch-stereogum-aotw.mjs
        continue-on-error: true
      - name: Fetch Twgeema monthly electronic chart
        id: twgeema
        run: node scripts/fetch-twgeema-monthly.mjs
        continue-on-error: true
      - name: Publish fast curated feeds
        run: |
          feed_files=(
            data/bleep-weekly.json
            data/boomkat-weekly.json
            data/bandcamp-electronic.json
            data/stereogum-aotw.json
            data/twgeema-monthly.json
            data/aoty-electronic.json
          )
          existing_files=()
          for file in "${feed_files[@]}"; do
            if [[ -e "$file" ]]; then
              existing_files+=("$file")
            fi
          done
          if [[ ${#existing_files[@]} -eq 0 ]] || [[ -z "$(git status --porcelain -- "${existing_files[@]}")" ]]; then
            echo "Feed is unchanged"
            exit 0
          fi
          git config user.name "NAGA Feed Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${existing_files[@]}"
          git commit -m "Update curated weekly feeds"
          git pull --rebase origin main
          git push
      - name: Report scraper health
        if: always()
        env:
          AOTY: ${{ steps.aoty.outcome }}
          BLEEP: ${{ steps.bleep.outcome }}
          BOOMKAT: ${{ steps.boomkat.outcome }}
          BANDCAMP: ${{ steps.bandcamp.outcome }}
          STEREOGUM: ${{ steps.stereogum.outcome }}
          TWGEEMA: ${{ steps.twgeema.outcome }}
        run: |
          {
            echo "## Curated scraper health"
            echo "| Source | Result |"
            echo "| --- | --- |"
            echo "| Album of the Year | $AOTY |"
            echo "| Bleep | $BLEEP |"
            echo "| Boomkat | $BOOMKAT |"
            echo "| Bandcamp Daily | $BANDCAMP |"
            echo "| Stereogum | $STEREOGUM |"
            echo "| Twgeema | $TWGEEMA |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Every scraper writes atomically only after producing a valid feed,
          # so a source failure leaves its last good JSON in place. Surface
          # outages as visible warnings without turning a healthy publication
          # run red. Installation, checkout and git-publish errors remain fatal.
          [[ "$AOTY" == "success" ]] || echo "::warning title=AOTY feed retained::Album of the Year was unavailable; keeping the last good feed"
          [[ "$BLEEP" == "success" ]] || echo "::warning title=Bleep feed retained::Bleep was unavailable or changed layout; keeping the last good feed"
          [[ "$BOOMKAT" == "success" ]] || echo "::warning title=Boomkat feed retained::Boomkat was unavailable or changed layout; keeping the last good feed"
          [[ "$BANDCAMP" == "success" ]] || echo "::warning title=Bandcamp feed retained::Bandcamp Daily was unavailable; keeping the last good feed"
          [[ "$STEREOGUM" == "success" ]] || echo "::warning title=Stereogum feed retained::Stereogum was unavailable or had no new article; keeping the last good feed"
          [[ "$TWGEEMA" == "success" ]] || echo "::warning title=Twgeema feed retained::Twgeema was unavailable; keeping the last good feed"

  update-label-watchlist:
    # The label scan performs many catalogue lookups and must not hold the fast
    # feeds hostage. A timeout leaves the last good label file untouched.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fetch experimental label watchlist
        id: labels
        timeout-minutes: 15
        run: node scripts/fetch-label-watchlist.mjs
        continue-on-error: true
      - name: Fetch Igloo and Quietus reviews
        id: editorial
        if: always() && !cancelled()
        timeout-minutes: 10
        run: node scripts/fetch-editorial-rss.mjs
        continue-on-error: true
      - name: Publish label watchlist
        if: always() && !cancelled() && (steps.labels.outcome == 'success' || steps.editorial.outcome == 'success')
        run: |
          if git diff --quiet -- data/label-watchlist.json; then
            echo "Label watchlist is unchanged"
            exit 0
          fi
          git config user.name "NAGA Feed Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/label-watchlist.json
          git commit -m "Update curated label watchlist"
          git pull --rebase origin main
          git push
      - name: Report label scraper health
        if: always()
        env:
          LABELS: ${{ steps.labels.outcome }}
          EDITORIAL: ${{ steps.editorial.outcome }}
        run: |
          {
            echo "## Label scraper health"
            echo "| Source | Result |"
            echo "| --- | --- |"
            echo "| Label watchlist | $LABELS |"
            echo "| Igloo / Quietus | $EDITORIAL |"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$LABELS" == "success" ]] || echo "::warning title=Label feed retained::Label scan timed out or failed; keeping the last good feed"
          [[ "$EDITORIAL" == "success" ]] || echo "::warning title=Editorial feed retained::Igloo / Quietus importer failed; keeping previous releases"
